; Observers for the cue tasker on the ADS-B Raspberry Pi. Only the passive-radar
; receive site, so every cue opportunity is one the RF collector can use.
; Position: surveyed receive-system location from
; flightTest TestSetupTesting/SiteGeometry.md (2026-09-24); altitude as in the
; built-in default observer. RF values must be explicit: the INI loader
; defaults receiverGainDbi to 0, unlike the built-in observer (10 dBi Yagi).
[Observer1]
name: Apple Hill Receive Site
role: local
locLat_locLon_locAlt: 42.29917940712679,-71.34964782414613,75
receiverGainDbi: 10
noiseFigureDb: 3
bandwidthMhz: 8
